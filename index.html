<style>
  :root {
    --bg: #0a0e1a;
    --card: rgba(255, 255, 255, 0.055);
    --card-border: rgba(255, 255, 255, 0.09);
    --text: #eef1f8;
    --muted: #9aa3b8;
    --indigo: #6366f1;
    --cyan: #22d3ee;
    --pink: #ec4899;
    --tt-pink: #fe2c55;
    --tt-cyan: #25f4ee;
    --radius: 20px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { scroll-behavior: smooth; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    overflow-x: hidden;
  }

  /* ---- Đốm sáng trang trí phía sau ---- */
  .glow {
    position: fixed;
    width: 420px; height: 420px;
    border-radius: 50%;
    filter: blur(130px);
    opacity: 0.32;
    z-index: -1;
    pointer-events: none;
  }
  .glow-1 { background: var(--indigo); top: -160px; left: -140px; }
  .glow-2 { background: var(--cyan); top: 30%; right: -200px; opacity: 0.18; }
  .glow-3 { background: var(--pink); bottom: -180px; left: -120px; opacity: 0.15; }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 40px 20px 48px;
  }

  /* ---- Phần đầu: avatar + tên ---- */
  .hero { text-align: center; }

  .avatar-ring {
    width: 116px; height: 116px;
    margin: 0 auto 18px;
    border-radius: 50%;
    padding: 4px;
    background: conic-gradient(from 180deg, var(--indigo), var(--cyan), var(--pink), var(--indigo));
    animation: spin 14s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .avatar-ring img {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--bg);
    animation: spin 14s linear infinite reverse;
    background: #1b2236;
  }

  .hero h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .handle {
    color: var(--muted);
    font-size: 15px;
    margin-top: 2px;
  }

  .greet {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 14px;
    color: #c7d2fe;
    background: rgba(99, 102, 241, 0.14);
    border: 1px solid rgba(99, 102, 241, 0.35);
  }
  .greet .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 8px #34d399;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.35; } }

  /* ---- Nút liên kết ---- */
  .links { margin-top: 26px; display: grid; gap: 12px; }

  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  @media (hover: hover) {
    .btn:hover { border-color: rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.09); }
  }

  .btn .ic {
    width: 42px; height: 42px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    font-size: 21px;
    flex-shrink: 0;
  }
  .ic-home { background: linear-gradient(135deg, rgba(99, 102, 241, 0.35), rgba(34, 211, 238, 0.25)); }
  .ic-update { background: linear-gradient(135deg, rgba(52, 211, 153, 0.32), rgba(34, 211, 238, 0.28)); }

  .btn .sub {
    display: block;
    font-size: 12.5px;
    font-weight: 400;
    color: var(--muted);
    margin-top: 1px;
  }

  .btn .arrow { margin-left: auto; color: var(--muted); font-size: 18px; }

  /* ---- Tiêu đề mục ---- */
  .section-title {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 36px 0 16px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
  }
  .section-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, var(--card-border), transparent);
  }

  /* ---- Thẻ phần mềm ---- */
  .cards { display: grid; gap: 12px; }

  .card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 16px;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid var(--card-border);
    text-decoration: none;
    color: var(--text);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:active { transform: scale(0.97); }
  @media (hover: hover) {
    .card:hover { border-color: rgba(255, 255, 255, 0.25); }
  }

  .card .ic {
    width: 48px; height: 48px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .ic-firmware{ background: linear-gradient(135deg, #b45309, #f59e0b); }

  .card .t { font-size: 15.5px; font-weight: 700; }
  .card .d { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .card .get {
    margin-left: auto;
    flex-shrink: 0;
    font-size: 12.5px;
    font-weight: 700;
    color: #a5b4fc;
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(99, 102, 241, 0.16);
    border: 1px solid rgba(99, 102, 241, 0.35);
  }

  /* ---- Chân trang ---- */
  footer {
    margin-top: 44px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  footer .heart { color: var(--pink); }

  /* ---- Hiệu ứng xuất hiện ---- */
  .rise { opacity: 0; transform: translateY(16px); animation: rise 0.6s ease forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .d1 { animation-delay: 0.05s; } .d2 { animation-delay: 0.15s; } .d3 { animation-delay: 0.25s; }
  .d4 { animation-delay: 0.35s; } .d5 { animation-delay: 0.45s; } .d6 { animation-delay: 0.55s; }
  .d7 { animation-delay: 0.65s; } .d8 { animation-delay: 0.75s; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .rise { opacity: 1; transform: none; }
  }

  /* ---- Giao diện glass / neon ---- */
  :root {
    --bg: #080b16;
    --card: rgba(17, 24, 44, 0.68);
    --card-border: rgba(164, 177, 220, 0.14);
    --text: #f5f7ff;
    --muted: #a4aec6;
    --radius: 22px;
  }

  body {
    background:
      radial-gradient(ellipse at 50% -20%, rgba(79, 70, 229, 0.2), transparent 55%),
      linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px),

  }
  .btn { min-height: 82px; }
  .btn::before,
  .card::before {
    position: absolute;
    inset: 0;
    content: "";
    background: linear-gradient(115deg, transparent 20%, rgba(255, 255, 255, 0.075) 48%, transparent 76%);
    transform: translateX(-120%);
    transition: transform 650ms ease;
    pointer-events: none;
  }
  .btn:focus-visible,
  .card:focus-visible {

  }
  .btn .ic { width: 46px; height: 46px; border-radius: 15px; }
  .btn .arrow { transition: transform 220ms ease, color 220ms ease; }

  .section-title {
    margin: 42px 0 18px;
    color: #c4cce0;
    font-size: 12px;
    letter-spacing: 0.18em;
  }
  .cards {
    grid-template-columns: minmax(0, 1fr);

  }
  .card {
    min-height: 100px;
    padding: 17px;
    border-radius: 20px;
  }
  .card > span:nth-child(2) { min-width: 0; }
  .card .t,
  .card .d { display: block; }

  .card .d { font-size: 12px; line-height: 1.45; margin-top: 5px; }
  .card .ic { width: 46px; height: 46px; border-radius: 15px; }
  .card .get {

  @media (hover: hover) {

  }

  footer { margin-top: 42px; font-size: 12px; }

  @media (max-width: 620px) {

  }

  @media (prefers-reduced-motion: reduce) {

  }
</style>
</head>
